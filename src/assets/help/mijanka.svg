<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 310" font-family="ui-monospace, Cascadia Mono, Consolas, monospace" font-size="12">
  <title>Semafory ścieżkowe na mijance linii jednotorowej</title>
  <defs>
    <path id="chev" d="M0 0 L-11 -6 L-11 6 Z" fill="#fff" stroke="#000" stroke-opacity=".7"/>
    <g id="post">
      <line x1="0" y1="7" x2="0" y2="22" stroke="#9aa0a8" stroke-width="2"/>
      <circle cx="0" cy="26" r="5" fill="currentColor" stroke="#111"/>
    </g>
    <g id="sigPath"><use href="#chev" xlink:href="#chev"/><use href="#post" xlink:href="#post"/></g>
    <path id="train" d="M-64 -7 H-7 L0 0 L-7 7 H-64 Z" fill="currentColor" stroke="#111"/>
  </defs>

  <rect width="800" height="310" fill="#1b1f24"/>
  <text x="30" y="24" fill="#ffe066" font-size="14" font-weight="bold">Mijanka na linii jednotorowej – semafory ścieżkowe</text>

  <g transform="translate(0 20)">
    <text x="100" y="100" fill="#9aa0a8" text-anchor="middle">jednotor</text>
    <text x="690" y="100" fill="#9aa0a8" text-anchor="middle">jednotor</text>
    <text x="400" y="119" fill="#9aa0a8" text-anchor="middle">mijanka</text>

    <g stroke="#6b7380" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="30" y1="115" x2="200" y2="115"/>
      <line x1="600" y1="115" x2="770" y2="115"/>
      <polyline points="200,115 250,70 550,70 600,115"/>
      <polyline points="200,115 250,160 550,160 600,115"/>
    </g>

    <!-- Droga T2 -->
    <polyline points="770,115 600,115 550,160 250,160 200,115 45,115" fill="none" stroke="#9fdc7c" stroke-width="3" stroke-dasharray="7 5"/>
    <path d="M34 115 L46 108 L46 122 Z" fill="#9fdc7c"/>

    <!-- Wyjazdy w prawo -->
    <use href="#sigPath" xlink:href="#sigPath" x="520" y="70" color="#ff6b5a"/>
    <use href="#sigPath" xlink:href="#sigPath" x="520" y="160" color="#ff6b5a"/>
    <!-- Wyjazdy w lewo -->
    <use href="#sigPath" xlink:href="#sigPath" transform="translate(280 70) rotate(180)" color="#ff6b5a"/>
    <use href="#sigPath" xlink:href="#sigPath" transform="translate(280 160) rotate(180)" color="#9fdc7c"/>

    <use href="#train" xlink:href="#train" x="508" y="70" color="#ffe066"/>
    <text x="476" y="74" text-anchor="middle" font-weight="bold" fill="#111">T1</text>
    <text x="440" y="50" text-anchor="middle" fill="#e8e4d8">T1 czeka na wolny jednotor</text>

    <use href="#train" xlink:href="#train" transform="translate(400 160) rotate(180)" color="#5aa9ff"/>
    <text x="432" y="164" text-anchor="middle" font-weight="bold" fill="#111">T2</text>

    <text x="540" y="210" fill="#9fdc7c" text-anchor="middle">T2 mija ten semafor od tyłu</text>
  </g>

  <text x="30" y="255" fill="#e8e4d8">Semafory stoją tylko na wyjazdach z mijanki i zatrzymują pociąg przed wjazdem na jednotor.</text>
  <text x="30" y="272" fill="#e8e4d8">T1 czeka, aż T2 zjedzie z jednotoru. T2 mija semafor dolnego toru od tyłu – jednokierunkowy</text>
  <text x="30" y="289" fill="#e8e4d8">by mu to zakazał. Na samym jednotorze semaforów nie stawiaj, bo pociągi zablokują się czołowo.</text>
</svg>
