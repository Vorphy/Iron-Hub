<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 480" font-family="ui-monospace, Cascadia Mono, Consolas, monospace" font-size="12">
  <defs>
    <!-- Strzałka na torze (grot w kierunku jazdy), jak w grze. -->
    <path id="chev" d="M0 0 L-11 -6 L-11 6 Z" fill="#fff" stroke="#000" stroke-opacity=".7"/>
    <!-- Słup z latarnią po prawej stronie toru patrząc w kierunku jazdy. -->
    <g id="post">
      <line x1="0" y1="7" x2="0" y2="22" stroke="#9aa0a8" stroke-width="2"/>
      <circle cx="0" cy="26" r="5" fill="currentColor" stroke="#111"/>
    </g>
    <g id="sigPath"><use href="#chev" xlink:href="#chev"/><use href="#post" xlink:href="#post"/></g>
    <g id="sigOne"><use href="#chev" xlink:href="#chev"/><use href="#chev" xlink:href="#chev" x="-9"/><use href="#post" xlink:href="#post"/></g>
    <path id="train" d="M-64 -7 H-7 L0 0 L-7 7 H-64 Z" fill="currentColor" stroke="#111"/>
    <g id="noEntry">
      <circle r="10" fill="#1b1f24" stroke="#ff6b5a" stroke-width="3"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#ff6b5a" stroke-width="3"/>
    </g>
  </defs>

  <rect width="800" height="480" fill="#1b1f24"/>

  <!-- Legenda -->
  <g fill="#e8e4d8">
    <use href="#chev" xlink:href="#chev" x="40" y="22"/>
    <text x="52" y="26">ścieżkowy – pojedyncza strzałka</text>
    <use href="#chev" xlink:href="#chev" x="330" y="22"/><use href="#chev" xlink:href="#chev" x="321" y="22"/>
    <text x="342" y="26">jednokierunkowy – podwójna strzałka</text>
    <circle cx="640" cy="22" r="5" fill="#ff6b5a"/><text x="650" y="26">stój</text>
    <circle cx="700" cy="22" r="5" fill="#9fdc7c"/><text x="710" y="26">wolna</text>
  </g>
  <line x1="20" y1="42" x2="780" y2="42" stroke="#4a5260"/>

  <!-- ===== 1. Ścieżkowe ===== -->
  <g transform="translate(0 50)">
    <text x="30" y="18" fill="#ffe066" font-size="14" font-weight="bold">1. Linia dwutorowa na semaforach ścieżkowych</text>
    <text x="770" y="46" fill="#9aa0a8" text-anchor="end">tor w prawo →</text>
    <text x="770" y="150" fill="#9aa0a8" text-anchor="end">← tor w lewo</text>

    <g stroke="#6b7380" stroke-width="4" stroke-linecap="round">
      <line x1="30" y1="60" x2="770" y2="60"/>
      <line x1="30" y1="125" x2="770" y2="125"/>
      <line x1="200" y1="60" x2="250" y2="125"/>
      <line x1="560" y1="125" x2="610" y2="60"/>
    </g>

    <!-- Objazd B pod prąd -->
    <polyline points="135,60 200,60 250,125 615,125" fill="none" stroke="#ff9f43" stroke-width="3" stroke-dasharray="7 5"/>

    <!-- Semafory: górny tor w prawo, dolny w lewo -->
    <use href="#sigPath" xlink:href="#sigPath" x="165" y="60" color="#9fdc7c"/>
    <use href="#sigPath" xlink:href="#sigPath" x="520" y="60" color="#ff6b5a"/>
    <use href="#sigPath" xlink:href="#sigPath" transform="translate(300 125) rotate(180)" color="#ff6b5a"/>
    <use href="#sigPath" xlink:href="#sigPath" transform="translate(660 125) rotate(180)" color="#ff6b5a"/>

    <use href="#train" xlink:href="#train" x="460" y="60" color="#5aa9ff"/>
    <text x="428" y="64" text-anchor="middle" font-weight="bold" fill="#111">A</text>
    <text x="428" y="46" text-anchor="middle" fill="#e8e4d8">stoi</text>

    <use href="#train" xlink:href="#train" x="130" y="60" color="#ffe066"/>
    <text x="98" y="64" text-anchor="middle" font-weight="bold" fill="#111">B</text>

    <use href="#train" xlink:href="#train" transform="translate(690 125) rotate(180)" color="#9fdc7c"/>
    <text x="722" y="129" text-anchor="middle" font-weight="bold" fill="#111">C</text>

    <text x="300" y="150" fill="#ff9f43">B objeżdża A dolnym torem pod prąd</text>
    <g transform="translate(625 125)" stroke="#ff6b5a" stroke-width="4" stroke-linecap="round">
      <line x1="-8" y1="-8" x2="8" y2="8"/><line x1="-8" y1="8" x2="8" y2="-8"/>
    </g>
    <text x="612" y="104" fill="#ff6b5a" text-anchor="middle" font-weight="bold">zator!</text>

    <text x="30" y="178" fill="#e8e4d8">Ścieżkowy zatrzymuje tylko pociągi jadące w stronę strzałki – od tyłu jest przejezdny.</text>
    <text x="30" y="195" fill="#e8e4d8">Gdy A blokuje górny tor, B wybiera objazd torem przeciwnym i staje czołowo naprzeciw C.</text>
  </g>

  <line x1="20" y1="258" x2="780" y2="258" stroke="#4a5260"/>

  <!-- ===== 2. Jednokierunkowe ===== -->
  <g transform="translate(0 268)">
    <text x="30" y="18" fill="#ffe066" font-size="14" font-weight="bold">2. Ta sama linia na semaforach jednokierunkowych</text>
    <text x="770" y="46" fill="#9aa0a8" text-anchor="end">tor w prawo →</text>
    <text x="770" y="150" fill="#9aa0a8" text-anchor="end">← tor w lewo</text>

    <g stroke="#6b7380" stroke-width="4" stroke-linecap="round">
      <line x1="30" y1="60" x2="770" y2="60"/>
      <line x1="30" y1="125" x2="770" y2="125"/>
      <line x1="200" y1="60" x2="250" y2="125"/>
      <line x1="560" y1="125" x2="610" y2="60"/>
    </g>

    <!-- C jedzie swobodnie -->
    <polyline points="620,125 40,125" fill="none" stroke="#9fdc7c" stroke-width="3" stroke-dasharray="7 5"/>

    <use href="#sigOne" xlink:href="#sigOne" x="165" y="60" color="#ff6b5a"/>
    <use href="#sigOne" xlink:href="#sigOne" x="520" y="60" color="#ff6b5a"/>
    <use href="#sigOne" xlink:href="#sigOne" transform="translate(300 125) rotate(180)" color="#9fdc7c"/>
    <use href="#sigOne" xlink:href="#sigOne" transform="translate(660 125) rotate(180)" color="#9fdc7c"/>

    <use href="#noEntry" xlink:href="#noEntry" x="345" y="125"/>
    <text x="345" y="150" fill="#ff6b5a" text-anchor="middle">B tędy nie wjedzie</text>

    <use href="#train" xlink:href="#train" x="460" y="60" color="#5aa9ff"/>
    <text x="428" y="64" text-anchor="middle" font-weight="bold" fill="#111">A</text>
    <text x="428" y="46" text-anchor="middle" fill="#e8e4d8">stoi</text>

    <use href="#train" xlink:href="#train" x="150" y="60" color="#ffe066"/>
    <text x="118" y="64" text-anchor="middle" font-weight="bold" fill="#111">B</text>
    <text x="118" y="46" text-anchor="middle" fill="#e8e4d8">czeka</text>

    <use href="#train" xlink:href="#train" transform="translate(620 125) rotate(180)" color="#9fdc7c"/>
    <text x="652" y="129" text-anchor="middle" font-weight="bold" fill="#111">C</text>
    <text x="510" y="150" fill="#9fdc7c">C jedzie dalej</text>

    <text x="30" y="178" fill="#e8e4d8">Jednokierunkowy też zatrzymuje w stronę strzałki, ale dodatkowo zakazuje jazdy pod prąd.</text>
    <text x="30" y="195" fill="#e8e4d8">B nie ma objazdu – czeka za A na swoim torze, a ruch w drugą stronę płynie bez przeszkód.</text>
  </g>
</svg>
